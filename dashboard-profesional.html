<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Profesional - AgendApp</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 2rem; }
    .profile-info h1 { margin: 0; font-size: 1.5rem; color: #38bdf8; }
    .profile-info p { margin: 0.2rem 0 0; color: #94a3b8; font-size: 0.9rem; }
    .btn-logout { background: #dc2626; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
    .stat-card h3 { margin: 0; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; }
    .stat-card .val { font-size: 1.8rem; font-weight: bold; margin-top: 0.5rem; color: #f8fafc; }

    .controls { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; background: #1e293b; padding: 1rem; border-radius: 8px; }
    input[type="date"] { background: #0f172a; border: 1px solid #475569; color: white; padding: 0.5rem; border-radius: 6px; }
    button.btn-refresh { background: #0284c7; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    th { background: #182234; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
    tr:hover { background: #243248; }

    .badge { padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: bold; }
    .badge-PENDIENTE { background: #fef08a; color: #854d0e; }
    .badge-CONFIRMADA { background: #bbf7d0; color: #166534; }
    .badge-FINALIZADA { background: #e2e8f0; color: #334155; }
    .badge-CANCELADA { background: #fecaca; color: #991b1b; }

    select.status-select { background: #0f172a; color: white; border: 1px solid #475569; padding: 0.3rem 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="profile-info">
      <h1 id="pro-name">Cargando...</h1>
      <p id="pro-spec">Especialista</p>
    </div>
    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <h3>Total Citas</h3>
      <div class="val" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <h3>Confirmadas</h3>
      <div class="val" id="stat-confirmadas" style="color: #4ade80;">0</div>
    </div>
    <div class="stat-card">
      <h3>Pendientes</h3>
      <div class="val" id="stat-pendientes" style="color: #facc15;">0</div>
    </div>
  </div>

  <div class="controls">
    <label>Filtrar por fecha:</label>
    <input type="date" id="filtro-fecha" onchange="cargarCitas()" />
    <button class="btn-refresh" onclick="cargarCitas(true)">Ver Todas</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Hora</th>
        <th>Fecha</th>
        <th>Cliente</th>
        <th>Teléfono</th>
        <th>Servicio</th>
        <th>Monto</th>
        <th>Estado</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="citas-body">
      <tr><td colspan="8" style="text-align: center; color: #64748b;">No hay citas registradas.</td></tr>
    </tbody>
  </table>

  <script>
  // 1. Obtener la sesión (soporta 'usuario' y 'profesional')
  const rawSession = localStorage.getItem('usuario') || localStorage.getItem('profesional');
  const session = JSON.parse(rawSession || '{}');

  // Si no hay sesión o no es profesional, redirigir
  const esProfesional = (session.rol === 'PROFESIONAL' || session.id_rol === 2);
  const idPro = session.id_profesional || session.id_usuario;

  if (!rawSession || !esProfesional || !idPro) {
    alert('Acceso restringido: Debes iniciar sesión con una cuenta de profesional.');
    window.location.href = 'login-profesional.html';
  }

  // 2. Desplegar información del encabezado
  document.getElementById('pro-name').textContent = `${session.nombre || ''} ${session.apellido || ''}`.trim() || 'Profesional';
  document.getElementById('pro-spec').textContent = `${session.especialidad || 'Especialista'} | ID Profesional: ${idPro}`;

  // 3. Cargar las citas conectando a CitaViewSet
  async function cargarCitas(limpiarFecha = false) {
    if (limpiarFecha) {
      document.getElementById('filtro-fecha').value = '';
    }
    const fecha = document.getElementById('filtro-fecha').value;

    // Endpoint real registrado por DefaultRouter
    let url = `http://127.0.0.1:8000/api/reservas/citas/?profesional=${idPro}`;
    if (fecha) {
      url += `&fecha=${fecha}`;
    }

    try {
      const res = await fetch(url);
      const citas = await res.json();
      const tbody = document.getElementById('citas-body');
      tbody.innerHTML = '';

      let total = citas.length;
      let conf = 0;
      let pend = 0;

      if (!citas || citas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #64748b;">No hay citas para mostrar.</td></tr>';
      } else {
        citas.forEach(c => {
          if (c.estado === 'CONFIRMADA') conf++;
          if (c.estado === 'PENDIENTE') pend++;

          // Formateo de fechas y horas según CitaReadSerializer
          const fechaCompleta = c.fecha_hora_inicio || '';
          const horaInicio = fechaCompleta.slice(11, 16);
          const horaFin = (c.fecha_hora_fin || '').slice(11, 16);
          const fechaCita = fechaCompleta.slice(0, 10);

          const cliente = c.cliente_nombre || (c.id_cliente ? `${c.id_cliente.nombre} ${c.id_cliente.apellido}` : 'Cliente');
          const telefono = c.cliente_telefono || (c.cliente && c.cliente.telefono) || (c.id_cliente && c.id_cliente.telefono) || 'Sin registro';
          const servicio = c.servicio_nombre || (c.id_servicio ? c.id_servicio.nombre : 'Servicio');
          const precioBruto = c.precio || c.precio_servicio || c.servicio_precio || (c.servicio && c.servicio.precio_base) || (c.id_servicio && c.id_servicio.precio_base) || 0;
 
          const precioNum = Number(precioBruto) || 0;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${horaInicio} - ${horaFin}</strong></td>
            <td>${fechaCita}</td>
            <td>${cliente}</td>
            <td>${telefono}</td>
            <td>${servicio}</td>
            <td>$${precioNum.toLocaleString('es-CL')}</td>
            <td>
              <select class="status-select" onchange="cambiarEstado(${c.id_cita}, this.value)">
                <option value="">Acción...</option>
                <option value="confirmar">CONFIRMAR</option>
                <option value="completar">COMPLETAR</option>
                <option value="cancelar">CANCELAR</option>
              </select>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-confirmadas').textContent = conf;
      document.getElementById('stat-pendientes').textContent = pend;
    } catch (err) {
      console.error('Error cargando citas:', err);
    }
  }

  // 4. Cambiar estado usando las acciones (@action) de CitaViewSet
  async function cambiarEstado(idCita, accion) {
    if (!accion) return;
    try {
      const res = await fetch(`http://127.0.0.1:8000/api/reservas/citas/${idCita}/${accion}/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      if (res.ok) {
        cargarCitas();
      } else {
        const error = await res.json();
        alert(error.mensaje || 'Error al actualizar el estado de la cita.');
      }
    } catch (err) {
      alert('Error de conexión al actualizar el estado.');
    }
  }

  function logout() {
    localStorage.clear();
    window.location.href = 'login-profesional.html';
  }

  // Carga inicial
  cargarCitas();
  </script>
</body>
</html>
