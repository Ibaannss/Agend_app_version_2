<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Profesionales - AgendApp</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; text-align: center; }
    .field { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.875rem; color: #94a3b8; }
    input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; }
    input:focus { border-color: #38bdf8; outline: none; }
    button { width: 100%; padding: 0.8rem; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
    button:hover { background: #0369a1; }
    .error { color: #f87171; font-size: 0.875rem; margin-top: 0.8rem; text-align: center; display: none; }
    .footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Acceso Profesional</h2>
    <div class="field">
      <label>Correo Electrónico</label>
      <input type="email" id="correo" value="carlos.valenzuela@agendapp.cl" required />
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" value="Admin1234." required />
    </div>
    <button onclick="login()">Iniciar Sesión</button>
    <div id="error-msg" class="error"></div>
    <div class="footer">AgendApp Pro Core v1.0</div>
  </div>

  <script>
async function login() {
  const correo = document.getElementById('correo').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('error-msg');
  errorMsg.style.display = 'none';

  try {
    // Apuntamos al endpoint existente en tu backend:
    const res = await fetch('http://127.0.0.1:8000/api/auth/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        correo: correo, 
        clave: password 
      })
    });
    
    const data = await res.json();

    if (res.ok) {
      // Verificamos que sea un profesional
      if (data.usuario.rol !== 'PROFESIONAL' && data.usuario.id_rol !== 2) {
        errorMsg.textContent = 'Acceso denegado: Esta cuenta no pertenece a un profesional.';
        errorMsg.style.display = 'block';
        return;
      }

      // Guardamos la sesión y redirigimos al dashboard
      localStorage.setItem('usuario', JSON.stringify(data.usuario));
      window.location.href = 'dashboard-profesional.html';
    } else {
      errorMsg.textContent = data.error || 'Credenciales no válidas.';
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    errorMsg.textContent = 'Error de conexión con el backend.';
    errorMsg.style.display = 'block';
  }
}
  </script>
</body>
</html>
